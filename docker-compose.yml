version: '3.8'

services:
  rovosim:
    build:
      context: .
      args:
        ROS2_DISTRO: ${ROS2_DISTRO:-rolling}
        GZ_VERSION: ${GZ_VERSION:-rolling}
    image: rovosim:latest
    container_name: rovosim
    runtime: nvidia
    environment:
      - DISPLAY=${DISPLAY}
      - NVIDIA_VISIBLE_DEVICES=all
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_zenoh_cpp}
      - GZ_SIM_RESOURCE_PATH=/opt/sim/models
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rwfs
      - ./ros2_ws:/opt/sim/ros2_ws
      - ./models:/opt/sim/models
      - ./gz_cache:/root/.gz
    devices:
      - /dev/dri:/dev/dri
      - /dev/bus/usb:/dev/bus/usb
      - /dev/input:/dev/input
    privileged: true
    ipc: host
    ulimits:
      memlock: -1
      stack: -1
    stdin_open: true
    tty: true
    working_dir: /opt/sim/ros2_ws
    network_mode: host
