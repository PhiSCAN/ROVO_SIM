services:
  rovosim:
    build:
      context: .
      args:
        ROS2_DISTRO: ${ROS2_DISTRO:-rolling}
        GZ_VERSION: ${GZ_VERSION:-rolling}
    image: rovosim:latest
    container_name: rovosim
    runtime: nvidia
    env_file: .env
    environment:
      - DISPLAY=${DISPLAY}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu/nvidia:/usr/lib/x86_64-linux-gnu
      - __NV_PRIME_RENDER_OFFLOAD=1
      - __GLX_VENDOR_LIBRARY_NAME=nvidia
      - GZ_SIM_RESOURCE_PATH=/opt/sim/models:/opt/sim/ros2_ws/install/veera_simulator/share:/opt/sim/ros2_ws/install/rovo_gz_description/share
      - RMW_IMPLEMENTATION=rmw_zenoh_cpp
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rwfs
      - ./ros2_ws:/opt/sim/ros2_ws
      - ./models:/opt/sim/models
      - ./gz_cache:/root/.gz
    devices:
      - /dev/dri:/dev/dri
      - /dev/bus/usb:/dev/bus/usb
      - /dev/input:/dev/input
    privileged: true
    ipc: host
    ulimits:
      memlock: -1
      stack: -1
    stdin_open: true
    tty: true
    working_dir: /opt/sim/ros2_ws
    network_mode: host

  rviz2:
    build:
      context: .
      args:
        ROS2_DISTRO: ${ROS2_DISTRO:-rolling}
        GZ_VERSION: ${GZ_VERSION:-rolling}
    image: rovosim:latest
    container_name: rviz2
    runtime: nvidia
    env_file: .env
    environment:
      - DISPLAY=${DISPLAY}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu/nvidia:/usr/lib/x86_64-linux-gnu
      - __NV_PRIME_RENDER_OFFLOAD=1
      - __GLX_VENDOR_LIBRARY_NAME=nvidia
      - RMW_IMPLEMENTATION=rmw_zenoh_cpp
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rwfs
      - ./ros2_ws:/opt/sim/ros2_ws
    devices:
      - /dev/dri:/dev/dri
    ipc: host
    stdin_open: true
    tty: true
    working_dir: /opt/sim/ros2_ws
    network_mode: host
    command: >
      bash -c "source /opt/ros/rolling/setup.bash &&
               source /opt/sim/ros2_ws/install/setup.bash &&
               exec rviz2"

  # Zenoh Router service for ROS 2 communication.
  # rmw_zenoh_cpp nodes connect to it as clients; peers discover each other
  # through the router.
  zenoh-router:
    image: eclipse/zenoh:1.0.0
    container_name: sim-zenoh-router
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./zenoh-router-config.json5:/etc/zenoh/config.json5:ro
    command: -c /etc/zenoh/config.json5