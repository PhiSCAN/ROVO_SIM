services:
  rovosim:
    build:
      context: .
      args:
        ROS2_DISTRO: ${ROS2_DISTRO:-rolling}
        GZ_VERSION: ${GZ_VERSION:-rolling}
    image: rovosim:latest
    container_name: rovosim
    runtime: nvidia
    env_file: .env
    environment:
      - DISPLAY=${DISPLAY}
      - NVIDIA_VISIBLE_DEVICES=all
      - GZ_SIM_RESOURCE_PATH=/opt/sim/models:/opt/sim/ros2_ws/install/veera_simulator/share:/opt/sim/ros2_ws/install/rovo_gz_description/share
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rwfs
      - ./ros2_ws:/opt/sim/ros2_ws
      - ./models:/opt/sim/models
      - ./gz_cache:/root/.gz
    devices:
      - /dev/dri:/dev/dri
      - /dev/bus/usb:/dev/bus/usb
      - /dev/input:/dev/input
    privileged: true
    # ipc: host
    stdin_open: true
    tty: true
    working_dir: /opt/sim/ros2_ws
    network_mode: host
